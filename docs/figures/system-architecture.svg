  <polygon points="1360,427 1345,435 1345,419" fill="#5A6B7B"/>
  <path d="M 420 490 L 420 555" fill="none" stroke="#C2410C" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
