  <text x="961.5" y="956" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#4A5A6B">client / data store</text>
  <text x="2050" y="956" text-anchor="end" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#4A5A6B">development topology: API, worker and web on the host · PostgreSQL and Redis in Docker Compose</text>
</svg>
