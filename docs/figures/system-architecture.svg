  <text x="438" y="535" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" font-style="italic" fill="#4A5A6B">extractCanonical()</text>
  <path d="M 1700 490 L 1700 555" fill="none" stroke="#C2410C" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <polygon points="1700,570 1692,555 1708,555" fill="#C2410C"/>
  <text x="1718" y="535" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" font-style="italic" fill="#4A5A6B">runFormat()</text>
