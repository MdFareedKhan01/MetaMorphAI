  <polygon points="570,770 562,755 578,755" fill="#6D28D9"/>
  <text x="588" y="738" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" font-style="italic" fill="#4A5A6B">public · internal</text>
  <path d="M 1580 695 L 1580 755" fill="none" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
