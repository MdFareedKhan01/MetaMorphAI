<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2100" height="990" viewBox="0 0 2100 990" role="img" aria-label="System architecture">
  <title>System architecture</title>
  <desc>Browser, API and worker sharing PostgreSQL and Redis, both calling one engine whose router decides between Gemini in the cloud and Ollama on the host.</desc>
  <rect width="2100" height="990" fill="#FFFFFF"/>
  <rect x="30" y="20" width="2040" height="150" rx="18" fill="#F7F9FB" stroke="#C7D3E0" stroke-width="2"/>
  <rect x="30" y="20" width="46" height="150" rx="18" fill="#0F2B46"/>
  <rect x="60" y="20" width="16" height="150" fill="#0F2B46"/>
  <text x="53" y="95" transform="rotate(-90 53 95)" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" font-weight="700" letter-spacing="1.5" fill="#FFFFFF">CLIENT</text>
  <rect x="30" y="200" width="2040" height="315" rx="18" fill="#F7F9FB" stroke="#C7D3E0" stroke-width="2"/>
  <rect x="30" y="200" width="46" height="315" rx="18" fill="#0F2B46"/>
  <rect x="60" y="200" width="16" height="315" fill="#0F2B46"/>
  <text x="53" y="357.5" transform="rotate(-90 53 357.5)" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" font-weight="700" letter-spacing="1.5" fill="#FFFFFF">SERVER + DATA</text>
  <rect x="30" y="545" width="2040" height="170" rx="18" fill="#F7F9FB" stroke="#C7D3E0" stroke-width="2"/>
  <rect x="30" y="545" width="46" height="170" rx="18" fill="#0F2B46"/>
  <rect x="60" y="545" width="16" height="170" fill="#0F2B46"/>
  <text x="53" y="630" transform="rotate(-90 53 630)" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" font-weight="700" letter-spacing="1.5" fill="#FFFFFF">ENGINE</text>
  <rect x="30" y="745" width="2040" height="170" rx="18" fill="#F7F9FB" stroke="#C7D3E0" stroke-width="2"/>
  <rect x="30" y="745" width="46" height="170" rx="18" fill="#0F2B46"/>
  <rect x="60" y="745" width="16" height="170" fill="#0F2B46"/>
  <text x="53" y="830" transform="rotate(-90 53 830)" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" font-weight="700" letter-spacing="1.5" fill="#FFFFFF">MODELS</text>
  <rect x="100" y="40" width="1950" height="110" rx="14" fill="#FFFFFF" stroke="#94A7BA" stroke-width="2"/>
  <text x="120" y="73.405" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#0F2B46">BROWSER · React 19 · Vite 8 · Tailwind 4</text>
  <text x="120" y="109.125" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#3B4A5A">Login · Signup · Ingest · Confirm · Workspace · Gallery — one independent card per artefact, every claim clickable to its source passage</text>
  <text x="120" y="136.845" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#3B4A5A">JWT in localStorage · the WebSocket resumes from the last seq after a drop</text>
  <rect x="100" y="225" width="640" height="265" rx="14" fill="#E6F2F5" stroke="#0E7490" stroke-width="3"/>
  <text x="120" y="294.325" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#0B3B4A">API · Express 5 · Zod 4</text>
  <text x="120" y="330.045" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#2F5560">auth: JWT 12 h · bcrypt · three roles</text>
  <text x="120" y="357.76500000000004" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#2F5560">POST /sources: unpdf · mammoth · spans</text>
  <text x="120" y="385.48500000000007" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#2F5560">extractCanonical() runs inside the request</text>
  <text x="120" y="413.2050000000001" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#2F5560">POST /jobs/batch → 202, then enqueue</text>
  <text x="120" y="440.9250000000001" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#2F5560">review · export · audit · WebSocket stream</text>
  <rect x="860" y="225" width="380" height="125" rx="14" fill="#FFFFFF" stroke="#94A7BA" stroke-width="2"/>
  <text x="880" y="265.905" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#0F2B46">POSTGRESQL 16 · Prisma 6</text>
  <text x="880" y="301.625" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#3B4A5A">users · sources · batches</text>
  <text x="880" y="329.345" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#3B4A5A">artefacts · claims · audit_log</text>
  <rect x="860" y="365" width="380" height="125" rx="14" fill="#FFFFFF" stroke="#94A7BA" stroke-width="2"/>
  <text x="880" y="405.905" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#0F2B46">REDIS 7 · ioredis 6</text>
  <text x="880" y="441.625" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#3B4A5A">BullMQ queue · rate counter</text>
  <text x="880" y="469.345" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#3B4A5A">task locks · event Streams</text>
  <rect x="1360" y="225" width="690" height="265" rx="14" fill="#E6F2F5" stroke="#0E7490" stroke-width="3"/>
  <text x="1380" y="308.18499999999995" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#0B3B4A">WORKER · BullMQ 6 · 3 concurrent</text>
  <text x="1380" y="343.905" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#2F5560">lock:task:{id} · one job per artefact</text>
  <text x="1380" y="371.625" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#2F5560">engine.runFormat() → save content + claims</text>
  <text x="1380" y="399.345" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#2F5560">XADD progress frames · audit rows</text>
  <text x="1380" y="427.06500000000005" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#B45309">offline stub if no key, or on any failure</text>
  <rect x="100" y="570" width="1950" height="125" rx="14" fill="#FDEDE6" stroke="#C2410C" stroke-width="4"/>
  <text x="120" y="610.905" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#7A2E0A">ENGINE · packages/ai — imported by the API and by the worker</text>
  <text x="120" y="646.625" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#7A3B1E">router.call() is the only way a prompt leaves: restricted → Ollama · rate limit → Ollama · internal → masked user message</text>
  <text x="120" y="674.345" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#7A3B1E">extractCanonical · runFormat · verifyClaims · reviseClaims — GeminiAdapter and OllamaAdapter behind one LLMAdapter interface</text>
  <rect x="100" y="770" width="940" height="120" rx="14" fill="#F3F0FF" stroke="#6D28D9" stroke-width="3"/>
  <text x="120" y="808.405" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#3B1A7A">GEMINI · cloud</text>
  <text x="120" y="844.125" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#4C3A7A">GEMINI_MODEL — public and internal sources</text>
  <text x="120" y="871.845" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#4C3A7A">429 or three transport failures → Ollama</text>
  <rect x="1110" y="770" width="940" height="120" rx="14" fill="#F3F0FF" stroke="#6D28D9" stroke-width="3"/>
  <text x="1130" y="808.405" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#3B1A7A">OLLAMA · on the host</text>
  <text x="1130" y="844.125" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#4C3A7A">qwen2.5:7b — restricted sources, and fallback</text>
  <text x="1130" y="871.845" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#4C3A7A">runs outside Docker so model weights survive a rebuild</text>
