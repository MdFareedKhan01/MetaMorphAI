  <rect x="100" y="938" width="22" height="22" rx="5" fill="#E6F2F5" stroke="#0E7490" stroke-width="3"/>
  <text x="132" y="956" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#4A5A6B">application process</text>
  <rect x="383.5" y="938" width="22" height="22" rx="5" fill="#FDEDE6" stroke="#C2410C" stroke-width="3"/>
  <text x="415.5" y="956" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#4A5A6B">egress gate lives here</text>
