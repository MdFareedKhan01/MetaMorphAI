  <text x="1240" y="822" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#C2410C">yes</text>
  <path d="M 1095 765 L 1095 682 L 1920 682 L 1920 700" fill="none" stroke="#15803D" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <polygon points="1920,715 1912,700 1928,700" fill="#15803D"/>
  <text x="1500" y="674" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#15803D">no findings</text>
