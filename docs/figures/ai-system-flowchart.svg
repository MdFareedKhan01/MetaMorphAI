<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2100" height="1080" viewBox="0 0 2100 1080" role="img" aria-label="AI engine flowchart">
  <title>AI engine flowchart</title>
  <desc>Ingest and split, extract the canonical object, build the prompt, route through the egress gate to Groq or Ollama, parse, verify with four deterministic checks, and repair at most once.</desc>
  <rect width="2100" height="1080" fill="#FFFFFF"/>
  <rect x="30" y="20" width="2040" height="265" rx="18" fill="#F7F9FB" stroke="#C7D3E0" stroke-width="2"/>
  <rect x="30" y="20" width="46" height="265" rx="18" fill="#0F2B46"/>
  <rect x="60" y="20" width="16" height="265" fill="#0F2B46"/>
  <text x="53" y="152.5" transform="rotate(-90 53 152.5)" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" font-weight="700" letter-spacing="1.5" fill="#FFFFFF">ONCE PER SOURCE</text>
  <rect x="30" y="325" width="2040" height="285" rx="18" fill="#F7F9FB" stroke="#C7D3E0" stroke-width="2"/>
  <rect x="30" y="325" width="46" height="285" rx="18" fill="#0F2B46"/>
  <rect x="60" y="325" width="16" height="285" fill="#0F2B46"/>
  <text x="53" y="467.5" transform="rotate(-90 53 467.5)" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" font-weight="700" letter-spacing="1.5" fill="#FFFFFF">ROUTE + GENERATE</text>
  <rect x="30" y="650" width="2040" height="360" rx="18" fill="#F7F9FB" stroke="#C7D3E0" stroke-width="2"/>
  <rect x="30" y="650" width="46" height="360" rx="18" fill="#0F2B46"/>
  <rect x="60" y="650" width="16" height="360" fill="#0F2B46"/>
  <text x="53" y="830" transform="rotate(-90 53 830)" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" font-weight="700" letter-spacing="1.5" fill="#FFFFFF">VERIFY + REPAIR ONCE</text>
  <rect x="100" y="40" width="590" height="225" rx="14" fill="#FFFFFF" stroke="#94A7BA" stroke-width="2"/>
  <text x="120" y="103.185" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#0F2B46">1  INGEST · SPLIT</text>
  <text x="120" y="138.905" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#3B4A5A">unpdf (per page) · mammoth · UTF-8, CRLF → LF</text>
  <text x="120" y="166.625" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#3B4A5A">Intl.Segmenter('sentence') → span_id, offsets, page</text>
  <text x="120" y="194.345" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#3B4A5A">SHA-256 source_hash · classification stored</text>
  <text x="120" y="222.065" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#3B4A5A">50 – 50,000 characters, else HTTP 400 / 413</text>
  <rect x="780" y="40" width="590" height="225" rx="14" fill="#E6F2F5" stroke="#0E7490" stroke-width="3"/>
  <text x="800" y="103.185" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#0B3B4A">2  EXTRACT · extractCanonical()</text>
  <text x="800" y="138.905" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#2F5560">source sits in the user role, one [span_id] per line</text>
  <text x="800" y="166.625" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#2F5560">z.toJSONSchema(Canonical) in the prompt</text>
  <text x="800" y="194.345" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#2F5560">safeParse, one retry that quotes the Zod issues</text>
  <text x="800" y="222.065" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#2F5560">keepKnownRefs() drops any span id the model invents</text>
  <rect x="1460" y="40" width="590" height="225" rx="14" fill="#E6F2F5" stroke="#0E7490" stroke-width="3"/>
  <text x="1480" y="103.185" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#0B3B4A">CANONICAL OBJECT · JSONB</text>
  <text x="1480" y="138.905" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#2F5560">severity · entities · events · affected_systems</text>
  <text x="1480" y="166.625" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#2F5560">indicators · key_facts (fact | inference)</text>
  <text x="1480" y="194.345" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#2F5560">recommendations — each item cites source_refs</text>
  <text x="1480" y="222.065" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#2F5560">stored once; formats read this, not the raw text</text>
  <path d="M 690 152 L 765 152" fill="none" stroke="#5A6B7B" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <polygon points="780,152 765,160 765,144" fill="#5A6B7B"/>
  <path d="M 1370 152 L 1445 152" fill="none" stroke="#0E7490" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <polygon points="1460,152 1445,160 1445,144" fill="#0E7490"/>
  <path d="M 1825 265 L 1825 330" fill="none" stroke="#0E7490" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <polygon points="1825,345 1817,330 1833,330" fill="#0E7490"/>
  <text x="1808" y="311" text-anchor="end" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" font-style="italic" fill="#4A5A6B">worker loads sources.canonical</text>
  <rect x="1600" y="345" width="450" height="245" rx="14" fill="#FFFFFF" stroke="#94A7BA" stroke-width="2"/>
  <text x="1620" y="404.325" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#0F2B46">3  BUILD PROMPT</text>
  <text x="1620" y="440.045" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#3B4A5A">one system prompt per format:</text>
  <text x="1620" y="467.76500000000004" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#3B4A5A">advisory · executive summary · LinkedIn</text>
  <text x="1620" y="495.48500000000007" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#3B4A5A">system = rules + canonical + JSON Schema</text>
  <text x="1620" y="523.205" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#3B4A5A">user = audience · tone · detail · language</text>
  <text x="1620" y="550.9250000000001" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#B45309">X thread, video package: not built yet</text>
  <rect x="1120" y="345" width="400" height="245" rx="14" fill="#FDEDE6" stroke="#C2410C" stroke-width="4"/>
  <text x="1140" y="404.325" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#7A2E0A">4  ROUTER · EGRESS GATE</text>
  <text x="1140" y="440.045" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#7A3B1E">restricted → Ollama  (policy)</text>
  <text x="1140" y="467.76500000000004" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#7A3B1E">INCR ratelimit:provider:cloud, 60 s</text>
  <text x="1140" y="495.48500000000007" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#7A3B1E">over CLOUD_RPM → Ollama  (rate_limit)</text>
  <text x="1140" y="523.205" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#7A3B1E">internal → Redactor masks the user</text>
  <text x="1140" y="550.9250000000001" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#7A3B1E">message: IP · URL · email · domain</text>
  <rect x="580" y="345" width="460" height="105" rx="14" fill="#F3F0FF" stroke="#6D28D9" stroke-width="3"/>
  <text x="600" y="375.905" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#3B1A7A">5a  GROQ · cloud</text>
  <text x="600" y="411.625" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#4C3A7A">llama-3.3-70b-versatile · temperature 0</text>
  <text x="600" y="439.345" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#4C3A7A">json_schema strict · 3 tries, 500·2ⁿ ms</text>
  <rect x="580" y="485" width="460" height="105" rx="14" fill="#F3F0FF" stroke="#6D28D9" stroke-width="3"/>
  <text x="600" y="515.905" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#3B1A7A">5b  OLLAMA · on the host</text>
  <text x="600" y="551.625" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#4C3A7A">qwen2.5:7b · num_ctx 8192 · format = schema</text>
  <text x="600" y="579.345" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#4C3A7A">180 s timeout · used for restricted + fallback</text>
  <rect x="100" y="345" width="410" height="245" rx="14" fill="#FFFFFF" stroke="#94A7BA" stroke-width="2"/>
  <text x="120" y="418.18499999999995" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#0F2B46">6  PARSE · VALIDATE</text>
  <text x="120" y="453.905" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#3B4A5A">parseModelJson() → outermost { }</text>
  <text x="120" y="481.625" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#3B4A5A">format schema .safeParse()</text>
  <text x="120" y="509.345" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#B91C1C">invalid → FORMAT_INVALID</text>
  <text x="120" y="537.065" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#B91C1C">schema failures get no repair</text>
