  <rect x="961" y="1032" width="22" height="22" rx="5" fill="#FFF4DB" stroke="#B45309" stroke-width="3"/>
  <text x="993" y="1050" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#4A5A6B">flagged</text>
  <text x="2050" y="1050" text-anchor="end" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#4A5A6B">steps 1–2 run in the API · steps 3–10 in a BullMQ worker · one job per format · 3 in flight</text>
