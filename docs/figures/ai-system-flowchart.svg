  <text x="270" y="636" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" font-style="italic" fill="#4A5A6B">schema-valid artefact</text>
  <rect x="100" y="720" width="300" height="210" rx="14" fill="#FFFFFF" stroke="#94A7BA" stroke-width="2"/>
  <text x="120" y="789.545" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#0F2B46">7  CLAIM IDS</text>
  <text x="120" y="825.265" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#3B4A5A">collectClaims()</text>
  <text x="120" y="852.985" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#3B4A5A">c1 … cn, reading order</text>
  <text x="120" y="880.705" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#3B4A5A">fact | inference | framing</text>
  <rect x="480" y="700" width="430" height="280" rx="14" fill="#E6F2F5" stroke="#0E7490" stroke-width="3"/>
  <text x="500" y="776.8249999999999" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#0B3B4A">8  VERIFY · verifyClaims()</text>
  <text x="500" y="812.545" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#2F5560">① every source_ref exists</text>
  <text x="500" y="840.265" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#2F5560">② lexical grounding ≥ 0.5</text>
  <text x="500" y="867.985" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#2F5560">③ identifiers ⊆ cited span</text>
  <text x="500" y="895.705" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#2F5560">④ source hedges preserved</text>
  <text x="500" y="923.4250000000001" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#0E7490">plain code · no model call</text>
  <polygon points="1095,765 1200,835 1095,905 990,835" fill="#FDEDE6" stroke="#C2410C" stroke-width="4"/>
  <text x="1095" y="845.125" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#7A2E0A">9  findings?</text>
  <rect x="1280" y="700" width="430" height="280" rx="14" fill="#FDEDE6" stroke="#C2410C" stroke-width="4"/>
  <text x="1300" y="776.8249999999999" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#7A2E0A">10  REPAIR · ONE call</text>
  <text x="1300" y="812.545" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#7A3B1E">reviseClaims(): failing claims</text>
  <text x="1300" y="840.265" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#7A3B1E">+ their findings + only their</text>
  <text x="1300" y="867.985" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#7A3B1E">cited spans, strict JSON schema</text>
  <text x="1300" y="895.705" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#7A3B1E">replaceClaimNode(), then re-verify</text>
  <text x="1300" y="923.4250000000001" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#B91C1C">no second repair, ever</text>
  <rect x="1790" y="715" width="260" height="110" rx="14" fill="#E7F6EC" stroke="#15803D" stroke-width="3"/>
  <text x="1810" y="762.265" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#14532D">READY</text>
  <text x="1810" y="797.985" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#1F5A36">passed · fixes[] kept</text>
  <rect x="1790" y="860" width="260" height="110" rx="14" fill="#FFF4DB" stroke="#B45309" stroke-width="3"/>
  <text x="1810" y="907.265" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#78350F">FLAGGED</text>
  <text x="1810" y="942.985" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#7A4A1A">open_issues[] → reviewer</text>
