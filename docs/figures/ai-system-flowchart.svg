  <text x="132" y="1050" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#4A5A6B">deterministic code</text>
  <rect x="373" y="1032" width="22" height="22" rx="5" fill="#FDEDE6" stroke="#C2410C" stroke-width="3"/>
