  <polygon points="1040,398 1055,390 1055,406" fill="#6D28D9"/>
  <text x="1080" y="386" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#4A5A6B">cloud</text>
  <path d="M 1120 537 L 1055 537" fill="none" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <polygon points="1040,537 1055,529 1055,545" fill="#6D28D9"/>
  <text x="1080" y="525" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#4A5A6B">local</text>
