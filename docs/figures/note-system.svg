<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="System overview">
  <title>System overview</title>
  <desc>Browser, API, queue, worker with engine, and models, backed by PostgreSQL.</desc>
  <rect width="1000" height="300" fill="#FFFFFF"/>
  <rect x="20" y="14" width="175" height="150" rx="14" fill="#FFFFFF" stroke="#94A7BA" stroke-width="2"/>
  <text x="32" y="60.55" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0F2B46">BROWSER</text>
  <text x="32" y="89.35" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#3B4A5A">React 19 · Vite 8</text>
  <text x="32" y="110.14999999999999" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#3B4A5A">card per artefact</text>
  <text x="32" y="130.95" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#3B4A5A">claim → source</text>
  <rect x="220" y="14" width="175" height="150" rx="14" fill="#E6F2F5" stroke="#0E7490" stroke-width="3"/>
  <text x="232" y="60.55" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0B3B4A">API</text>
  <text x="232" y="89.35" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#2F5560">Express 5 · Zod 4</text>
  <text x="232" y="110.14999999999999" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#2F5560">JWT · 3 roles</text>
  <text x="232" y="130.95" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#2F5560">ingest + extract</text>
  <rect x="420" y="14" width="175" height="150" rx="14" fill="#FFFFFF" stroke="#94A7BA" stroke-width="2"/>
  <text x="432" y="60.55" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0F2B46">QUEUE</text>
  <text x="432" y="89.35" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#3B4A5A">Redis 7 · BullMQ</text>
  <text x="432" y="110.14999999999999" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#3B4A5A">1 job per format</text>
  <text x="432" y="130.95" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#3B4A5A">3 in flight</text>
  <rect x="620" y="14" width="175" height="150" rx="14" fill="#FDEDE6" stroke="#C2410C" stroke-width="4"/>
  <text x="632" y="60.55" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#7A2E0A">WORKER</text>
  <text x="632" y="89.35" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#7A3B1E">runs the engine:</text>
  <text x="632" y="110.14999999999999" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#7A3B1E">router = gate,</text>
  <text x="632" y="130.95" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#7A3B1E">verify, repair</text>
  <rect x="820" y="14" width="160" height="150" rx="14" fill="#F3F0FF" stroke="#6D28D9" stroke-width="3"/>
  <text x="832" y="60.55" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#3B1A7A">MODELS</text>
  <text x="832" y="89.35" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#4C3A7A">Groq · Llama 3.3</text>
  <text x="832" y="110.14999999999999" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#4C3A7A">Ollama · Qwen 2.5</text>
  <text x="832" y="130.95" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#4C3A7A">restricted → local</text>
  <path d="M 195 89 L 205 89" fill="none" stroke="#5A6B7B" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <polygon points="220,89 205,97 205,81" fill="#5A6B7B"/>
  <path d="M 395 89 L 405 89" fill="none" stroke="#5A6B7B" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <polygon points="420,89 405,97 405,81" fill="#5A6B7B"/>
  <path d="M 595 89 L 605 89" fill="none" stroke="#5A6B7B" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <polygon points="620,89 605,97 605,81" fill="#5A6B7B"/>
  <path d="M 795 89 L 805 89" fill="none" stroke="#6D28D9" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <polygon points="820,89 805,97 805,81" fill="#6D28D9"/>
  <rect x="220" y="210" width="575" height="76" rx="14" fill="#FFFFFF" stroke="#94A7BA" stroke-width="2"/>
  <text x="232" y="240.35" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0F2B46">POSTGRESQL 16 · Prisma</text>
  <text x="232" y="269.15" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#3B4A5A">sources · artefacts · claims · hash-chained audit log</text>
  <path d="M 307 164 L 307 195" fill="none" stroke="#5A6B7B" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <polygon points="307,210 299,195 315,195" fill="#5A6B7B"/>
  <path d="M 707 164 L 707 195" fill="none" stroke="#5A6B7B" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <polygon points="707,210 699,195 715,195" fill="#5A6B7B"/>
  <text x="322" y="192" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-style="italic" fill="#4A5A6B">API and worker both write</text>
</svg>
